\\nこれらの権利及び自由に対する共通の理解は、この誓約を完全にするためにもっとも重要であるので、\\nよって、ここに、国連総会は、\\n社会の各個人及び各機関が、この世界人権宣言を常に念頭に置きながら、加盟国自身の人民の間にも、また、加盟国の管轄下にある地域の人民の間にも、これらの権利と自由との尊重を指導及び教育によって促進すること並びにそれらの普遍的措置によって確保することに努力するように、すべての人民とすべての国とが達成すべき共通の基準として、この人権宣言を公布する。\"]],[\"CgoKCHNhel9TYXVy\",[\"ꢦꢶꢪ꣄ꢫꢳꢸ ꢚꢵꢞꢸ ꢥꢷꢞꢵꢪ꣄ ꢫꢶꢭ꣄ꢭꣁ ꢐꢠ꣄ꢜꢾꢥꣁ ꢨꢶꢱꢶꢬꢾꢱ꣄,\",\"ꢔꢹꢟ ꢓꢾꢥꢶꢥ, ꢦꢶꢪ꣄ꢫꢳꢸ ꢚꢵꢞꢸ ꢥꢷꢞꢵꢪ꣄ ꢫꢶꢭ꣄ꢭꣁ ꢐꢠ꣄ꢜꢾꢥꣁ ꢨꢶꢱꢶꢬꢾꢱ꣄, ꢒꣂꢪ꣄ꢩꢸꢳ ꢥꢬꢾꢳ꣄ ꢧꣁꢞꢶꢒꢶꢥ꣄ ꢒꣂꢥ꣄ ꢣꢶꢫꢾꢡꢶꢥꢸ ꢂꢱꢬꢾꢱ꣄.\\nꢥꢵꢒ꣄ ꢣꢷ ꢣꣁꢳꢵ ꢪꢴꢣ꣄ꢣꢪ꣄ ꢥꢗꢬꢷꢱ ꢱꢒ꣄ꢡꢶ ꢱꢮꣂ, ꢧꢸꢭꢸ ꢲꣁꢬꢸ ꢕꢭꢶꢒꢶꢥ꣄ ꢦꢨꢙꢾ ꢒꢾꢬꢡ꣄ꢡꢒ꣄ ꢂꢮꣁ. ꢡ꣄ꢫꣁ ꢒꢵꢫꣁ?\\nꢱꣂꢬꢵꢜ꣄ ꢕꣁꢞꢵ ꢬꢾꢡ꣄ꢡꢸꢪ꣄ ꢱꣁꢳꢧꢵꢬ꣄ ꢂꢮꢫ꣄ ꢬꢙꣁ, ꢥꢾꢣ꣄ꢣꢪ꣄ ꢱ꣄ꢥꢵꢥ꣄ ꢒꢾꢬ꣄ꢭꢶ ꢥꢶꢡ꣄ꢡꢾ ꢒꢸꢙꣁ. ꢡ꣄ꢫꣁ ꢒꢵꢫꢱ?\"]],[\"EggKBkh1bmlubg\\u003d\\u003d\",[\"鑑於對人類家庭所有成員的固有尊嚴及其平等的和不移的權利的承認，乃是世界自由、正義與和平的基礎\",\"鑑於對人類大家庭所有成員固有 ê 尊嚴，以及𪜶 (in) 平等 koh buē 振動 ê 權利 ê 承認，是世界自由、正義 kah 和平 ê 基礎。\\n鑑於對人權个忽視同侮蔑，已經發展做野蠻个暴行，這兜暴行破壞了人類个良心；加上講，一儕人人都享有言論同信仰自由，又毋使驚怕同欠缺个世界，已經分人宣布做一般大眾最高个願望。\\n鑑於為使人類不致迫不得已鋌而走險對暴政和壓迫進行反抗，有必要使人權受法治的保護。\\n鑑於有必要促進各國之間友好關係个發展。\\n鑑於各聯合國國家人民已在《聯合國憲章》中重申他們對基本人權、人格尊嚴和價值以及男女平等權利的信念，並決心促成更寬大自由範圍內的社會進步和較佳的生活水平。\\n鑑於各會員國 lóng 已經發誓要 kah 聯合國合作，來促進對人權 kah 基本自由 ê 普遍尊重 kah 遵守。\\n鑑於對這兜權利同自由个普遍瞭解，對確實實現這隻誓願有最大个重要性。\\n因此，大會發佈這一《世界人權宣言》，作為所有人民和所有國家努力實現的共同標準，希望每一隻人同社會機構時常記等本宣言，努力通過教導同教育促進對權利同自由个尊重，使遮 ê 權利 kah 自由在各會員國本身人民 kah 𪜶 (in) 管轄下領土 ê 人民 tiong 得到普遍 kah 有效 ê 承認 kah 遵行。\\n咱人生來 lóng-sī 自由 ê，在尊嚴 kah 權利上 it-lu̍t 平等。In 賦有理性 kah 良心，而且應該以兄弟姊妹 ê 情分互相對待。\\n人人有資格享有本宣言所載的一切權利和自由，不分種族、膚色、性別、語言、宗教、政治或其他見解、國籍或社會出身、財產、出生或其他身分等任何區別。並且袂得因為一儕人所屬个國家或者領土个政治、行政或者國際地位个無共樣而有區別，無論該隻領土係獨立領土、託管領土、非自治領土或者處在其他任何主權受限制个情況之下。\"]]],1946,\"CB4\\u003d\"]]],null,null,null,null,[[[\"aa_Latn\",\"Afar\"],[\"ace_Latn\",\"Achinese\"],[\"acf_Latn\",\"Saint Lucian Creole French, Latin\"],[\"acu_Latn\",\"Achuar-Shiwiar\"],[\"af_Latn\",\"Afrikaans\"],[\"agr_Latn\",\"Aguaruna\"],[\"aii_Latn\",\"Assyrian Neo-Aramaic, Latin\"],[\"ala_Latn\",\"Alago\"],[\"aln_Latn\",\"Gheg Albanian\"],[\"amc_Latn\",\"Amahuaca\"],[\"ame_Latn\",\"Yaneshaʼ\"],[\"ami_Latn\",\"Amis\"],[\"amr_Latn\",\"Amarakaeri\"],[\"an_Latn\",\"Aragonese\"],[\"anw_Latn\",\"Anaang\"],[\"aoz_La
